name: Feature request
description: Propose a capability or an improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is painful or impossible today, and for whom.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like the plugin to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - auth / credentials
        - model catalog
        - sanitizer
        - watchdog
        - quota telemetry
        - docs
        - other
    validations:
      required: true
  - type: checkboxes
    id: guarantees
    attributes:
      label: Guarantees
      options:
        - label: This proposal keeps credential injection limited to an exact host match
          required: true
        - label: This proposal keeps every hook fail-open
          required: true
